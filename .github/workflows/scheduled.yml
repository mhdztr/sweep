name: scheduled

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    # Rust support may be preview (docs/CI-CD.md §12): scheduled-first,
    # never a required check; promote only once it proves stable.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  scorecard:
    # Weekly posture report only; never a required check (CI-CD.md §5).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: scorecard

  beta:
    # Early warning for upstream breakage. continue-on-error at the job
    # level: an upstream beta bug must never block anything (CI-CD.md §4).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # Pinned to dtolnay/rust-toolchain's `beta` BRANCH ref, not `stable`.
      # Dependabot's actions group gets this wrong: it rewrites the SHA to
      # the stable ref while leaving `toolchain: beta` (PR #2, closed).
      # Re-resolve with: git ls-remote https://github.com/dtolnay/rust-toolchain refs/heads/beta
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # beta
        with:
          toolchain: beta
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build on beta
        run: cargo build --locked
      - name: Test on beta
        run: cargo test --all-targets --locked
