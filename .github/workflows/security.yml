name: security

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    # Required check (docs/CI-CD.md §8) — job name is a contract.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: embarkstudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  machete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Unused dependencies (ignored per Cargo.toml metadata, CI-CD.md §5.2)
        run: cargo machete

  actionlint:
    # Workflow hygiene lives here, not in packaging.yml (CI-CD.md §5, decision G).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned actionlint (no pipe-install)
        run: |
          version="1.7.12"
          curl -fsSLO -L "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSLO -L "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt"
          grep "actionlint_${version}_linux_amd64.tar.gz" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          chmod +x actionlint
          sudo install actionlint /usr/local/bin/actionlint
      - name: Lint workflows
        run: actionlint

  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  dependency-review:
    # Vulnerable/mislicensed deps introduced by a PR only (CI-CD.md §5).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # No floating v4/v5 major tag is published for this action; pin the
      # full tag (GitHub-owned either way).
      - uses: actions/dependency-review-action@v5.0.0
