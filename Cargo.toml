[package]
name = "sweep"
version = "0.1.0"
edition = "2024"
description = "Advanced, safety-first storage cleaner for Linux — Arch-first, distro-aware"
license = "MIT"
readme = "README.md"
keywords = ["cleaner", "disk", "storage", "linux", "arch"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
comfy-table = "7"
dirs = "6"
filetime = "0.2"
glob = "0.3"
indicatif = "0.17"
inquire = "0.7"
jwalk = "0.8"
libc = "0.2"
owo-colors = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
filetime = "0.2"
insta = "1"
libc = "0.2"
predicates = "3"
rayon = "1"
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = true
