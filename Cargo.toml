[package]
name = "sweep"
version = "0.1.0"
edition = "2024"
description = "Advanced, safety-first storage cleaner for Linux — Arch-first, distro-aware"
license = "MIT"
readme = "README.md"
keywords = ["cleaner", "disk", "storage", "linux", "arch"]
categories = ["command-line-utilities"]
repository = "https://github.com/mhdztr/sweep"
homepage = "https://github.com/mhdztr/sweep"
# Discovered with `cargo +<N> build --locked` (cargo msrv's index download is
# blocked on this host): floor cannot be below 1.85 (edition 2024); 1.85-1.87
# fail on comfy-table (let chains, stabilized in 1.88); 1.88 is the first
# green build. Keep in sync with the `msrv` job in .github/workflows/ci.yml.
rust-version = "1.88"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
comfy-table = "8"
dirs = "7"
filetime = "0.2"
glob = "0.3"
indicatif = "0.18"
inquire = "0.9"
jwalk = "0.9"
libc = "0.2"
owo-colors = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
filetime = "0.2"
insta = "1"
libc = "0.2"
predicates = "3"
rayon = "1"
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
# "debuginfo" (not `true`) so `cargo auditable`'s embedded dependency metadata
# survives stripping (docs/CI-CD.md §7.2); verified by `cargo audit bin` in
# the release workflow's audit-bin job.
strip = "debuginfo"

# cargo-machete ignores (docs/CI-CD.md §5.2). Every entry names the milestone
# that makes the dependency real; the list must shrink as milestones land.
# `clap_complete` is NOT listed: it is used since M1 (`sweep completion`).
# Note: the section key is `cargo-machete` (not `machete`) in machete 0.9.2.
[package.metadata.cargo-machete]
ignored = [
    "inquire",      # M2: interactive checklist (ui/checklist.rs)
    "comfy-table",  # M2: decide remove vs keep (hand-rolled renderer won, R4)
    "clap_mangen",  # M7: man page generation
]
