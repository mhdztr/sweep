# cargo-deny policy (docs/CI-CD.md §5.1). Format is cargo-deny 0.20's
# version-2 config (there is no `version =` key in this generation).
#
# Every ignore/allow entry names its crate and a reason. Blanket ignores are
# a review failure (docs/CI-CD.md §12).

[advisories]
yanked = "deny"
# No ignores. The two entries previously here were retired on 2026-10-20 when
# the dependency bump landed: `indicatif` 0.18 dropped `number_prefix`
# (RUSTSEC-2025-0119 was retracted as stale by cargo-deny) and `inquire` 0.9
# dropped `fxhash` (RUSTSEC-2025-0057 likewise). Neither crate is in the
# dependency graph any more, so both ignores were dead entries. Keep this list
# empty unless a future advisory genuinely reaches the graph.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",     # unicode-ident, unicode-width: license-text license, no copyleft
    "MPL-2.0",         # option-ext via dirs-sys: weak file-level copyleft, fine for a CLI dependency
]

[bans]
wildcards = "deny"
# Expected first-run warning: two `unicode-width` versions (0.1.x via
# indicatif, 0.2.x direct). Warn-only until that duplicate is reviewed
# (docs/CI-CD.md §5.1); tighten to "deny" afterwards.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
